<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Two Four | Walkie-Talkie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- App Header -->
        <header class="app-header">
            <div class="brand-group">
                <div class="brand-badge">24</div>
                <div class="brand-text">
                    <h1 class="brand-title">TWO FOUR</h1>
                    <span class="brand-subtitle">Push-to-Talk Comms</span>
                </div>
            </div>

            <div class="connection-status" id="connection-status">
                <span class="status-indicator"></span>
                <span id="connection-status-text">CONNECTING</span>
            </div>
        </header>

        <!-- Top Controls: PIN & Connection -->
        <section class="controls-card">
            <!-- User's Own PIN Bar -->
            <div class="user-pin-row">
                <div class="pin-info">
                    <span class="control-label">MY PIN</span>
                    <span class="pin-value" id="my-pin-display">-------</span>
                </div>
                <button id="copy-pin-btn" class="btn-secondary" title="Copy your PIN" aria-label="Copy PIN">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span id="copy-btn-text">Copy</span>
                </button>
            </div>

            <div class="divider"></div>

            <!-- Connect to Friend Form -->
            <form id="connect-form" class="connect-form" onsubmit="return false;">
                <div class="connect-input-group">
                    <input 
                        type="text" 
                        id="friend-pin-input" 
                        class="input-pin" 
                        placeholder="Friend PIN" 
                        maxlength="7" 
                        inputmode="numeric" 
                        pattern="[0-9]*" 
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <div class="select-wrapper">
                        <select id="connection-duration" class="select-duration" title="Connection Duration">
                            <option value="forever">Forever</option>
                            <option value="8h">8 Hours</option>
                        </select>
                    </div>
                    <button type="submit" id="connect-btn" class="btn-primary">
                        Connect
                    </button>
                </div>
            </form>

            <!-- Connected Session Banner (Hidden when on own PIN) -->
            <div class="active-session-bar" id="active-session-bar" style="display: none;">
                <div class="session-status">
                    <span class="session-label">TUNED IN</span>
                    <span class="session-timer" id="session-timer-text">Forever</span>
                </div>
                <button id="disconnect-btn" class="btn-disconnect" title="Disconnect and return to own PIN">
                    Disconnect
                </button>
            </div>
        </section>

        <!-- Channel HUD Info Bar -->
        <div class="channel-hud">
            <div class="hud-item">
                <span class="hud-label">CHANNEL</span>
                <span class="hud-value" id="active-channel-display">CH: -------</span>
            </div>
            <div class="hud-item text-right">
                <span class="hud-label">PEERS</span>
                <span class="hud-value" id="peer-count-display">Solo</span>
            </div>
        </div>

        <!-- Center: PTT Button Section (Dominates screen on mobile) -->
        <main class="ptt-main">
            <!-- Audio Meter / Wave Visualizer -->
            <div class="meter-wrapper">
                <canvas id="visualizer-canvas" width="240" height="24"></canvas>
            </div>

            <!-- Massive PTT Button -->
            <div class="ptt-button-wrap">
                <button id="ptt-btn" class="ptt-button" disabled aria-label="Hold to talk">
                    <div class="ptt-content">
                        <svg class="mic-svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                        <span class="ptt-label" id="ptt-action-text">HOLD TO TALK</span>
                    </div>
                </button>
            </div>

            <!-- Live State Message -->
            <div class="status-readout">
                <span class="readout-state" id="status-message">STANDBY</span>
                <span class="readout-hint">Push &amp; hold to speak &bull; Release to send</span>
            </div>
        </main>

        <!-- Audio Unlock Alert Banner (Autoplay policy fallback) -->
        <div id="audio-unlock-banner" class="audio-banner" style="display: none;">
            <span>Audio paused by system</span>
            <button id="audio-unlock-btn" class="btn-banner">Unmute</button>
        </div>
    </div>

    <!-- Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
